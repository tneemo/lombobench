[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lombo"
version = "0.1.0"
description = "LomboBench: black-box observability of Ollama's external inference controls (phase 1 of LomboAI)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tneemo"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
transformers = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.29",
]
nnsight = [
    "nnsight>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lombo*"]
exclude = ["nnsight*", "tests*"]
