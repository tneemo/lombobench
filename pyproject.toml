[project]
name = "lombo"
version = "0.1.0"
description = "LomboBench — observabilidade caixa-preta dos controles externos de inferência do Ollama (Fase 1 do LomboAI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
transformers = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.29",
]
nnsight = [
    "nnsight>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lombo*"]
exclude = ["nnsight*", "tests*"]
