[project]
name = "lombo"
version = "0.1.0"
description = "LomboBench — observabilidade caixa-preta dos controles externos de inferência do Ollama (Fase 1 do LomboAI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
